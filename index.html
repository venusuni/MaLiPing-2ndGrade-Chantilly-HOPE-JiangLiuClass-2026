panel.querySelectorAll('.wordchip').forEach(b=>b.onclick=()=>{let w=DATA[+b.dataset.i];$('detailBank').innerHTML=`<div class="bigchar" style="font-size:85px">${w.hanzi}</div><div class="pinyin">${w.pinyin}</div><div class="hintword">${esc(w.example)} · ${esc(w.meaning)}</div><div class="controls"><button id="bankSay" class="btn">🔊 读一读</button><button id="bankWrite" class="btn primary">✍️ 练习写这个字</button></div>`;$('bankSay').onclick=()=>speak(PROMPTS[w.hanzi]||w.hanzi);$('bankWrite').onclick=()=>{writeIndex=w.i;setTab('write')}});let c=$('bankActions');c.append(btn('🖨️ 打印字表',()=>window.print()));c.append(btn('🔁 练习错题',()=>{let a=DATA.filter(w=>missed[w.hanzi]);if(a.length){tab='dict';document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));startSession('dict',shuffle(a))}else alert('目前还没有错题，可以先做一次听写测验！')},'soft'));}
$('weekOne').onclick=()=>switchWeek('first');$('weekDec').onclick=()=>switchWeek('dec');
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='game'){game=null}setTab(b.dataset.tab)});
// Tiny English navigation hints only: the Chinese labels remain big and first.
const TRANSLATIONS = [
[/本周日.*第一组/, 'Week 1'],[/两周后.*十二月/, 'December test'],
[/听写练习/, 'Dictation'],[/写字练习/, 'Write'],[/认字卡/, 'Read cards'],[/识字游戏/, 'Games'],[/模拟考试/, 'Test'],[/全部字表/, 'Word list'],
[/开始.*字模拟考/, 'Start test'],[/10 字热身/, '10 warm-up'],[/^全部 \d+ 字$/, 'All characters'],[/词语挑战/, 'Word challenge'],[/只练错题/, 'Mistakes only'],
[/试听/, 'Test voice'],[/擦掉重写/, 'Clear & retry'],[/再听一次/, 'Listen again'],[/看答案并核对/, 'Check answer'],
[/我写对了/, 'I got it'],[/我需要再练/, 'Try again'],[/重新练这些错题/, 'Retry mistakes'],[/再来一轮/, 'Play again'],[/看全部字表/, 'Word list'],
[/听一听/, 'Listen'],[/隐藏描红/, 'Hide guide'],[/显示描红/, 'Show guide'],[/清除/, 'Clear'],[/检查写得像不像/, 'Check writing'],[/还不熟/, 'Keep practicing'],[/再练/, 'Practice more'],[/会写了/, 'I know it'],[/记住了/, 'I know it'],[/下一个|下一题/, 'Next'],
[/听发音/, 'Listen'],[/看拼音选字/, 'Match pinyin'],[/听声音选字/, 'Match sound'],[/点击听音/, 'Play sound'],[/读一读/, 'Read aloud'],[/练习写这个字/, 'Write this'],[/打印字表/, 'Print list'],[/练习错题/, 'Retry mistakes']
];
let englishEnabled=true;
function translatedLabel(button){
  const zh=Array.from(button.childNodes).filter(n=>n.nodeType===Node.TEXT_NODE).map(n=>n.textContent).join(' ').replace(/[🔊✍️🃏🎮🏆📚⚡🧩🔁✅🙈👀🧽🔎🖨️→]/gu,'').replace(/\s+/g,' ').trim();
  // Preserve a pure character button; only navigation and action controls are translated.
  if(!zh || button.matches('.wordchip,.option,.cardface'))return '';
  for(const [pattern,english] of TRANSLATIONS){if(pattern.test(zh))return english;}
  return '';
}
function decorateEnglish(root=document){
  const buttons=root.querySelectorAll ? root.querySelectorAll('button') : [];
  buttons.forEach(b=>{
    const english=translatedLabel(b); const current=b.querySelector(':scope > .en-hint');
    if(!english){if(current)current.remove();return;}
    if(current){if(current.textContent!==english)current.textContent=english;return;}
    const span=document.createElement('span');span.className='en-hint';span.lang='en';span.setAttribute('aria-hidden','true');span.textContent=english;b.appendChild(span);
  });
}
try{englishEnabled=localStorage.getItem('chris-show-english')!=='false'}catch(e){}
$('showEnglish').checked=englishEnabled;document.body.classList.toggle('hide-english',!englishEnabled);
$('showEnglish').addEventListener('change',e=>{englishEnabled=e.target.checked;document.body.classList.toggle('hide-english',!englishEnabled);try{localStorage.setItem('chris-show-english',String(englishEnabled))}catch(e){}});
// Most app buttons are re-created after each answer; update hints as the game changes.
const observer=new MutationObserver(()=>decorateEnglish());observer.observe(document.querySelector('.app'),{childList:true,subtree:true});
stats();render();decorateEnglish();

const app=document.querySelector('.app');if(app)app.insertBefore(help,app.firstChild);
}
})();
